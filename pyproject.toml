[project]
name = "hinari"
version = "0.1.0"
description = "Hinari - single human-like Discord member"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.7.1",
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "tiktoken>=0.14.0",
]

[project.scripts]
hinari = "hinari.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
