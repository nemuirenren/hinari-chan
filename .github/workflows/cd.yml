name: CD

# Deploys ONLY on merged PRs to main. Direct pushes match nothing here
# (and branch protection blocks them anyway), so they deploy nothing.
on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/hinari
            git fetch origin main
            git reset --hard origin/main
            /home/deploy/.local/bin/uv sync --locked
            sudo systemctl restart hinari
            sleep 10
            sudo systemctl is-active --quiet hinari
      - name: Verify service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo systemctl is-active hinari
